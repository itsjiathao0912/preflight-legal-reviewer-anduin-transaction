<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare · Sub-doc QA (design trial)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (copied verbatim from review-workspace.html) ===== */
:root{
  --ground:#E9ECE9;      /* app ground: low-chroma cool stone */
  --panel:#F4F6F3;       /* panels one tone step above ground */
  --card:#FBFCFA;        /* cards one step above panel */
  --paper:#FDFEFD;       /* document page */
  --ink:#15181B;
  --ink-2:#434A50;       /* 8.0:1 on panel */
  --ink-3:#5C646B;       /* 5.6:1 on panel */
  --accent:#1D5C57;      /* the single accent: deep teal */
  --accent-tint:#D9E8E5;
  --step:#DDE2DD;        /* tone step used instead of rules */
  --block-fg:#8A1C1C; --block-bg:#F7E2DF;
  --fix-fg:#734400;   --fix-bg:#F5E8C8;
  --note-fg:#38454F;  --note-bg:#DFE6EA;
  --ok-fg:#1B5632;    --ok-bg:#DAEEDF;
  --mark:#F3D676;
  --r:4px;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:8px;top:-48px;background:var(--ink);color:#fff;padding:8px 13px;border-radius:var(--r);z-index:50}
.skip:focus{top:8px}

/* ===== Shell ===== */
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);min-width:1000px}
header.top{padding:14px 24px 0;display:grid;gap:13px}
.row1{display:flex;align-items:center;gap:20px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font:500 20px/1 var(--serif);letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:28px;height:28px}
.docid{min-width:0;flex:1;padding-left:20px;margin-left:2px;position:relative}
.docid::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--step)}
.docid h1{margin:0;font:500 14px/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docid .meta{display:flex;gap:18px;color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden}
.docid .meta b{font-weight:500;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--step);border-radius:var(--r);padding:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:3px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:4px;align-items:flex-end}
.tabs button{border:0;background:transparent;padding:8px 13px;font-size:14px;color:var(--ink-3);border-radius:var(--r) var(--r) 0 0;display:flex;gap:6px;align-items:center}
.tabs button[aria-current=page]{background:var(--panel);color:var(--ink);font-weight:500}
.tabs button:not([aria-current]):hover{color:var(--ink)}
.cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:13px;padding:0 6px;min-width:18px;text-align:center}

/* ===== Band: one comparison bar + one stats row ===== */
.band{background:var(--panel);margin:0 -24px;padding:10px 24px 12px;display:grid;gap:10px}
.cbar{display:flex;align-items:center;justify-content:space-between;gap:13px;flex-wrap:wrap}
.sent{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.sent select{width:auto;max-width:300px;background-color:var(--card);padding:7px 30px 7px 12px;font-size:14px;font-weight:500;border-radius:var(--r)}
.sent select:hover{background-color:#fff}
.iconbtn{border:0;background:transparent;width:32px;height:32px;border-radius:var(--r);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--step);color:var(--ink)}
.cap{margin:0;font:600 13px/1.2 var(--sans);color:var(--ink-3)}
.stats{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.gcap{font-weight:600;color:var(--ink-3);margin-right:2px}
.sdiv{width:2px;align-self:stretch;min-height:22px;background:var(--step);margin:0 10px}
.chip{border:0;background:var(--card);border-radius:var(--r);padding:4px 10px;display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip b{font-weight:600;color:var(--ink)}
button.chip:hover{background:#fff}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip[aria-pressed=true] b{color:#fff}
.chip:disabled{background:transparent;color:var(--ink-3);cursor:default}
.chip:disabled b{color:var(--ink-3)}
.chip.static{background:transparent;color:var(--ink-3)}
.clear{border:0;background:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:500;padding:4px 6px;margin-left:4px}
.clear[hidden]{display:none}

/* ===== Workspace ===== */
.main{display:grid;grid-template-columns:440px minmax(0,1fr);min-height:0}
.lp{background:var(--card);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.lh{padding:16px 20px 10px;display:grid;gap:8px}
.lh .ft{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lh h2{margin:0;font:500 20px/1.2 var(--serif);letter-spacing:-.01em}
.lh .sum{color:var(--ink-3);font-size:13px}
.hint{font-size:13px;color:var(--ink-2);background:var(--panel);border-radius:var(--r);padding:8px 10px;margin:0}
kbd{font:500 13px var(--sans);background:var(--step);border-radius:3px;padding:0 5px;color:var(--ink-2)}
.kbdhint{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.scroll{overflow:auto;min-height:0}
.llist{padding:4px 20px 40px}
.grp{margin:0 0 20px}
.grp.muted{opacity:.85}
.grp>h3{margin:0 0 8px;font:600 13px/1.2 var(--sans);color:var(--ink-3);display:flex;gap:6px}
ul.cards{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.card{background:var(--panel);border-radius:var(--r);transition:background .2s}
.card.sel{background:var(--paper);border-left:3px solid var(--accent);outline:2px solid var(--accent-tint)}
.chead{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;display:grid;gap:6px;border-radius:var(--r)}
.chead:hover{background:rgba(21,24,27,.03)}
.l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;gap:5px;align-items:center;font-size:13px;font-weight:600;padding:2px 8px 2px 6px;border-radius:3px}
.badge svg{width:14px;height:14px}
.b-block{background:var(--block-bg);color:var(--block-fg)}
.b-fix{background:var(--fix-bg);color:var(--fix-fg)}
.b-note{background:var(--note-bg);color:var(--note-fg)}
.b-ok{background:var(--ok-bg);color:var(--ok-fg)}
.b-st{background:var(--step);color:var(--ink-2)}
.b-new{background:var(--accent-tint);color:var(--accent)}
.b-low{background:var(--paper);color:var(--ink-2);outline:1px dashed var(--ink-3);outline-offset:-1px}
.ttl{font-weight:500;font-size:14px;line-height:1.4}
.l3{display:flex;gap:13px;color:var(--ink-3);font-size:13px;flex-wrap:wrap;align-items:center}
.l3 span{display:inline-flex;gap:4px;align-items:center}
.l3 svg{width:13px;height:13px}
.tag{font-size:13px;font-weight:500;padding:1px 7px;border-radius:3px;display:inline-flex;gap:4px;align-items:center;background:var(--step);color:var(--ink-2)}
.tag svg{width:13px;height:13px}

/* rename table */
table.rt{width:100%;border-collapse:separate;border-spacing:0 2px;font-size:14px}
table.rt th{font:600 13px var(--sans);color:var(--ink-3);text-align:left;padding:2px 10px}
table.rt th.num,table.rt td.num{text-align:right}
table.rt td{background:var(--panel);padding:4px 10px}
table.rt td:first-child{border-radius:var(--r) 0 0 var(--r);padding:0}
table.rt td:last-child{border-radius:0 var(--r) var(--r) 0}
table.rt tr.sel td{background:var(--paper)}
table.rt tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rb{border:0;background:transparent;width:100%;text-align:left;padding:8px 10px;display:flex;gap:6px;align-items:center;font-size:14px;border-radius:var(--r) 0 0 var(--r)}
.rb:hover{background:rgba(21,24,27,.04)}
table.rt tfoot td{background:transparent;color:var(--ink-3);font-size:13px;padding:4px 10px}

/* diff pane */
.dp{background:var(--panel);padding:20px 32px 80px;min-height:0}
.dpin{max-width:980px;margin:0 auto;display:grid;gap:16px}
.dh{display:flex;justify-content:space-between;gap:13px;align-items:flex-start;flex-wrap:wrap}
.dh h2{margin:8px 0 0;font:500 20px/1.25 var(--serif);letter-spacing:-.01em}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center}
.blk{display:grid;gap:8px}
.bh{display:flex;justify-content:space-between;gap:13px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.bh b{font-weight:600}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.col{display:grid;gap:6px;align-content:start}
.ch{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ch b{color:var(--ink-2);font-weight:600}
.ch svg{width:13px;height:13px}
.doc{background:var(--paper);border-radius:var(--r);padding:16px 20px;font:400 16px/1.72 var(--serif);color:#1b1e21;margin:0}
.doc.void{background:var(--step);color:var(--ink-2);font:400 14px/1.5 var(--sans);display:flex;align-items:center;gap:8px}
ins{background:var(--ok-bg);color:var(--ok-fg);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;padding:0 2px;border-radius:2px}
del{background:var(--block-bg);color:var(--block-fg);text-decoration:line-through;text-decoration-thickness:2px;padding:0 2px;border-radius:2px}
ins::before{content:"+ ";font:600 13px var(--sans);text-decoration:none;display:inline-block}
del::before{content:"\2212 ";font:600 13px var(--sans);display:inline-block}
.fl{background:rgba(56,69,79,.1);text-decoration:underline dotted var(--ink-3);text-decoration-thickness:2px;text-underline-offset:3px;padding:0 2px;border-radius:2px}
.note{background:var(--card);border-radius:var(--r);padding:13px 14px;display:grid;gap:10px}
.note p{margin:0;font-size:14px;color:var(--ink-2)}
.prov{display:flex;gap:13px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center}
.prov span{display:inline-flex;gap:5px;align-items:center}
.occ{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:0;padding:0;list-style:none}
.occ li{background:var(--panel);border-radius:var(--r);padding:6px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:var(--r);padding:8px 13px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center;background:var(--step);color:var(--ink)}
.btn:hover{background:#D1D8D2}
.btn:active{transform:scale(.98)}
.btn[aria-pressed=true]{background:var(--accent);color:#fff}
.btn svg{width:14px;height:14px}
table.ot{width:100%;border-collapse:separate;border-spacing:0 2px;font-size:14px}
table.ot th{font:600 13px var(--sans);color:var(--ink-3);text-align:left;padding:2px 10px}
table.ot td{background:var(--paper);padding:6px 10px}
table.ot td:first-child{border-radius:var(--r) 0 0 var(--r)}
table.ot td:last-child{border-radius:0 var(--r) var(--r) 0}
table.ot .same{color:var(--ink-2)}
.empty{padding:28px 8px;color:var(--ink-3);text-align:center;display:grid;gap:6px;justify-items:center}
.empty svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:var(--r);padding:10px 14px;display:none;gap:14px;align-items:center;z-index:60;font-size:13px}
.toast.on{display:flex}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* narrow desktop (1024) */
@media (max-width:1279px){
  .main{grid-template-columns:360px minmax(0,1fr)}
  .dp{padding:20px 20px 80px}
  .doc{padding:14px 14px}
  .docid .meta{gap:13px}
  .brand span{display:none}
}
@media (max-width:1100px){.docid .meta span:nth-child(n+3){display:none}}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="row1">
      <div class="brand"><svg class="i" style="stroke:none;fill:none" aria-hidden="true"><use href="#logo"/></svg><span>Sub-doc QA</span></div>
      <div class="docid">
        <h1>Version compare · Partners Group Next Generation Infrastructure LLC</h1>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <div class="row1" style="justify-content:space-between;align-items:flex-end">
      <nav class="tabs" aria-label="Workspace views">
        <button type="button" data-other="Review workspace">Review</button>
        <button type="button" data-other="Structure view">Structure</button>
        <button type="button" aria-current="page">Compare</button>
        <button type="button" data-other="Counsel query sheet">Counsel sheet <span class="cnt" id="counselCount" hidden>0</span></button>
      </nav>
    </div>
    <div class="band">
      <div class="cbar">
        <div class="sent" role="group" aria-label="Documents being compared">
          <select id="pBase" aria-label="Base version"></select>
          <button class="iconbtn" id="swapBtn" type="button" aria-label="Swap base and compare" title="Swap base and compare"><svg class="i" aria-hidden="true"><use href="#swap"/></svg></button>
          <select id="pCmp" aria-label="Compare version"></select>
        </div>
        <div class="seg" role="group" aria-label="Comparison type">
          <button type="button" data-mode="version" aria-pressed="true">Versions</button>
          <button type="button" data-mode="sibling" aria-pressed="false" title="Sibling documents (feeder/parallel)">Siblings</button>
        </div>
      </div>
      <div class="stats" id="strip" aria-label="Summary"></div>
    </div>
  </header>

  <main class="main">
    <aside class="lp" id="changes" aria-label="Changes" tabindex="-1">
      <div class="lh">
        <div class="ft"><h2 id="lt">Changes</h2><span class="sum" id="sum"></span></div>
        <p class="hint" id="modehint" hidden></p>
        <div class="kbdhint"><kbd>J</kbd><kbd>K</kbd> next or previous change</div>
      </div>
      <div class="scroll llist" id="llist" tabindex="-1"></div>
    </aside>
    <section class="scroll dp" id="dp" aria-label="Clause comparison" tabindex="-1"><div class="dpin" id="dpin"></div></section>
  </main>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- storage (always guarded) ---------- */
const store='subdocqa-compare-trial';
function safeGet(k){try{return window.localStorage.getItem(k);}catch(e){return null;}}
function safeSet(k,v){try{window.localStorage.setItem(k,v);}catch(e){}}
function safeParse(t){try{return t?JSON.parse(t):{};}catch(e){return {};}}

/* ---------- documents (fictional) ---------- */
const FIRM='Hartwell & Crane LLP', FUND='Next Generation Infrastructure';
const MODES={
 version:{docs:{
   v24:{short:'2024 template',opt:'2024 template · Units wording',meta:'Hartwell & Crane LLP · Next Generation Infrastructure · uploaded 3 Feb 2026 · 12 sections'},
   v26:{short:'2026 template',opt:'2026 template · Shares wording',meta:'Hartwell & Crane LLP · Next Generation Infrastructure · uploaded 9 Mar 2026 · 11 sections + 2 appendices'}},
   order:['v24','v26'],lBase:'Base version',lCmp:'Compare version',
   meta:'Comparing 2024 template with 2026 template'},
 sibling:{docs:{
   A:{short:'Onshore feeder',opt:'Onshore feeder · 2026 template',meta:'Hartwell & Crane LLP · NGI Onshore Feeder LLC · seeded sibling fixture · 12 sections'},
   B:{short:'Offshore feeder',opt:'Offshore feeder · 2026 template',meta:'Hartwell & Crane LLP · NGI Offshore Feeder Ltd · seeded sibling fixture · 13 sections'}},
   order:['A','B'],lBase:'Document A',lCmp:'Document B',
   meta:'Comparing the onshore and offshore feeder documents'}
};

/* ---------- diff helpers ---------- */
function parse(s){const out=[],re=/\{([-+?])([\s\S]*?)\1\}/g;let m,last=0;
  while((m=re.exec(s))){if(m.index>last)out.push(['=',s.slice(last,m.index)]);out.push([m[1],m[2]]);last=re.lastIndex;}
  if(last<s.length)out.push(['=',s.slice(last)]);return out;}
const swapT=t=>t.map(([k,s])=>[k==='-'?'+':k==='+'?'-':k,s]);
const words=s=>s.trim().split(/\s+/).filter(Boolean).length;
function side(tokens,sd){return tokens.map(([k,s])=>{
  if(k==='=')return esc(s);
  if(k==='?')return `<span class="fl">${esc(s)}</span>`;
  if(k==='-'&&sd==='L')return `<del><span class="sr">[removed: </span>${esc(s)}<span class="sr">]</span></del>`;
  if(k==='+'&&sd==='R')return `<ins><span class="sr">[added: </span>${esc(s)}<span class="sr">]</span></ins>`;
  return '';}).join('');}
function inline(tokens){return tokens.map(([k,s])=>{
  if(k==='=')return esc(s);
  if(k==='?')return `<span class="fl">${esc(s)}</span>`;
  if(k==='-')return `<del><span class="sr">[removed: </span>${esc(s)}<span class="sr">]</span></del>`;
  return `<ins><span class="sr">[added: </span>${esc(s)}<span class="sr">]</span></ins>`;}).join('');}
function countText(tk){const r=tk.filter(t=>t[0]==='-').reduce((a,t)=>a+words(t[1]),0),a=tk.filter(t=>t[0]==='+').reduce((x,t)=>x+words(t[1]),0);
  const p=[];if(r)p.push(`${r} word${r>1?'s':''} removed`);if(a)p.push(`${a} word${a>1?'s':''} added`);
  if(p.length)return p.join(' · ');return tk.some(t=>t[0]==='?')?'Wording unchanged':'Identical';}
function blockHTML(b){
  let tk=parse(b.t),loc=b.loc.slice();if(rev()){tk=swapT(tk);loc.reverse();}
  const dl=doc(S.base).short,dr=doc(S.cmp).short;
  const head=`<div class="bh"><b>${esc(b.head)}</b><span>${countText(tk)}</span></div>`;
  if(S.view==='inline'){
    return `<div class="blk">${head}<div class="col"><div class="ch">${ic('pin')}<b>Base</b> ${esc(loc[0])} <span aria-hidden="true">→</span> <b>Compare</b> ${esc(loc[1])}</div><p class="doc">${inline(tk)}</p></div></div>`;}
  const lh=tk.some(t=>t[0]==='='||t[0]==='?'||t[0]==='-'),rh=tk.some(t=>t[0]==='='||t[0]==='?'||t[0]==='+');
  const col=(sd,name,l,has,tag)=>`<div class="col"><div class="ch"><b>${tag}</b> ${esc(name)} ${ic('pin')}${esc(l)}</div>${has?`<p class="doc">${side(tk,sd)}</p>`:`<p class="doc void">${ic('minus')}Not in ${esc(name)}</p>`}</div>`;
  return `<div class="blk">${head}<div class="cols">${col('L',dl,loc[0],lh,'Base')}${col('R',dr,loc[1],rh,'Compare')}</div></div>`;}

  const A=doc('A').short,B=doc('B').short;
  return[
   {cap:'Clauses',cells:[

    {k:'differ',l:'differing',icon:'neq',m:i=>i.kind==='differ'},

   {cap:'Findings delta',cells:[
    {k:'fboth',l:'in both',icon:'check',stat:5,m:()=>false},
    {k:'fA',l:'only in '+A,icon:'only',m:i=>i.kind==='fonly'&&i.onlyDoc==='A'},
    {k:'fB',l:'only in '+B,icon:'only',m:i=>i.kind==='fonly'&&i.onlyDoc==='B'}]}];}
const allCells=()=>cellDefs().flatMap(g=>g.cells);
function renderStrip(){
  const its=same()?[]:items();
  const groups=cellDefs().map((g,gi)=>`${gi?'<span class="sdiv" aria-hidden="true"></span>':''}<span class="gcap">${g.cap}</span>${g.cells.map(c=>{
    const n=c.stat!=null?c.stat:its.filter(c.m).length;
    const inner=`${ic(c.icon)}<b>${n}</b> ${c.l}`;
    if(c.stat!=null)return `<span class="chip static">${inner}</span>`;
    if(!n)return `<button type="button" class="chip" disabled>${inner}</button>`;
    return `<button type="button" class="chip" data-cell="${c.k}" aria-pressed="${S.filter===c.k}">${inner}</button>`;}).join('')}`).join('');
  $('#strip').innerHTML=groups+`<button type="button" class="clear" id="clearf"${S.filter?'':' hidden'}>Clear</button>`;
}

  const sel=it.id===S.sel,sub=rev()&&it.subRev?it.subRev:it.sub;
  const tags=(reviewed[it.id]?`<span class="tag">${ic('check')}Reviewed</span>`:'')+(counsel[it.id]?`<span class="tag">${ic('counsel')}Needs counsel</span>`:'');
  return `<li class="card${sel?' sel':''}"><button class="chead" type="button" data-sel="${it.id}" aria-current="${sel}"><span class="l1">${badge(it)}${tags}</span><span class="ttl">${esc(titleOf(it))}</span><span class="l3"><span>${ic('pin')}${esc(sub)}</span></span></button></li>`;}
function tableHTML(list){
  const r=rev(),tot=list.reduce((a,i)=>a+i.n,0);
  return `<table class="rt"><caption class="sr">Terminology renames with occurrence counts</caption><thead><tr><th scope="col">${r?'Was in compare':'Before'}</th><th scope="col">${r?'Now':'After'}</th><th scope="col" class="num">Uses</th></tr></thead><tbody>${list.map(i=>{
    const a=r?i.to:i.from,b=r?i.from:i.to,sel=i.id===S.sel;
    return `<tr class="${sel?'sel':''}"><td><button type="button" class="rb" data-sel="${i.id}" aria-current="${sel}"><span class="sr">Renamed </span>${esc(a)}${reviewed[i.id]?ic('check'):''}</button></td><td>${ic('rename')} ${esc(b)}</td><td class="num">${i.n}</td></tr>`;}).join('')}</tbody><tfoot><tr><td colspan="3">${tot} uses in the ${r?'compare':'base'} version across ${list.length} terms</td></tr></tfoot></table>`;}
function renderList(){
  const vis=visible(),sm=same();
  let h='';
  if(sm){h=`<div class="empty">${ic('check')}<b>No differences</b><span>Both sides are the same document. Pick two different documents to compare.</span></div>`;}
  else if(!vis.length){h=`<div class="empty"><b>Nothing matches this filter.</b></div>`;}
  else GROUPS[S.mode].forEach(g=>{
    const l=vis.filter(i=>i.g===g.id);if(!l.length)return;
    h+=`<section class="grp${g.id==='low'?' muted':''}" aria-label="${esc(g.t)}"><h3>${esc(g.t)} <span>(${l.length})</span></h3>${g.table?tableHTML(l):`<ul class="cards">${l.map(cardHTML).join('')}</ul>`}</section>`;});
  $('#llist').innerHTML=h;
  $('#sum').textContent=sm?'0 changes':`${vis.length} shown · ${Object.keys(reviewed).filter(k=>reviewed[k]).length} reviewed`;
  const hint=$('#modehint');
  hint.hidden=S.mode!=='sibling'||sm;
  hint.textContent='Omnibus view: common clauses can live once in a shared form; differing clauses become entity-specific variants.';
  $('#lt').textContent=S.mode==='sibling'?'Clauses':'Changes';
}

/* ---------- diff pane ---------- */
function outlineHTML(){
  const r=rev();
  const row=(a,b,res)=>`<tr><td>${esc(a)}</td><td>${b}</td><td class="${res==='Same'?'same':''}">${ic(res==='Same'?'same':res==='Added'?'plus':'minus')} ${res}</td></tr>`;
  const sec=OUT.map(([n,t])=>row(`Section ${n}`,esc(t),'Same')).join('');
  const parts=PARTS.map(([n,t])=>row(`Section 6, Part ${n}`,esc(t),'Same')).join('');
  const app=row('Appendix A','Eligible Investor Criteria','Same')+row('Appendix B','Investor Questionnaire','Same')+row('Appendix C','Subscriber Wire Confirmation Form',r?'Added':'Removed');
  return `<div class="note"><table class="ot"><caption class="sr">Section list in both versions</caption><thead><tr><th scope="col">Where</th><th scope="col">Title in both versions</th><th scope="col">Result</th></tr></thead><tbody>${sec}${parts}${app}</tbody></table></div>`;}
function renderDiff(){
  const el=$('#dpin');
  if(same()){el.innerHTML=`<div class="empty">${ic('check')}<b>No differences</b><span>The base and compare documents are the same. Nothing to show.</span></div>`;return;}
  const it=byId(S.sel);
  if(!it||!visible().includes(it)){el.innerHTML=`<div class="empty"><b>Select a change to see the clauses side by side.</b></div>`;return;}
  const k=kindOf(it);
  let sub='';
  if(it.kind==='renamed'){const a=rev()?it.to:it.from,b=rev()?it.from:it.to;sub=`<span class="tag">${ic('rename')}${esc(a)} → ${esc(b)}</span><span class="tag">${it.n} uses in ${it.secs} sections</span>`;}
  const lowNote=k==='low'?`<p class="note" style="background:var(--paper)"><span><b>Low confidence, not asserted.</b> This is not a finding and is not counted in the summary.</span></p>`:'';
  el.innerHTML=`
   <div class="dh"><div><span class="l1">${badge(it)}${sub}</span><h2>${esc(titleOf(it))}</h2></div>
    <div class="seg" role="group" aria-label="Diff layout"><button type="button" data-view="side" aria-pressed="${S.view==='side'}">Side by side</button><button type="button" data-view="inline" aria-pressed="${S.view==='inline'}">Inline</button></div></div>
   <div class="legend" aria-label="Legend"><span><ins>added words</ins></span><span><del>removed words</del></span><span><span class="fl">flagged, unchanged</span></span></div>
   ${lowNote}
   ${it.outline?outlineHTML():it.blocks.map(blockHTML).join('')}
   <div class="note">
    <p>${esc(it.why)}</p>
    ${it.occ?`<ul class="occ" aria-label="Where the phrase appears">${it.occ.map(o=>`<li><span>${esc(o[0])}</span><b>×${o[1]}</b></li>`).join('')}</ul>`:''}
    <div class="prov"><span>${ic(/^AI/.test(it.prov)?'spark':'rule')}${esc(it.prov)}</span><span>${ic(k==='low'?'help':'check')}Confidence: ${esc(it.conf)}</span></div>
    <div class="acts"><button type="button" class="btn" data-act="review" data-id="${it.id}" aria-pressed="${!!reviewed[it.id]}">${ic('check')}${reviewed[it.id]?'Reviewed':'Mark reviewed'}</button>
    <button type="button" class="btn" data-act="counsel" data-id="${it.id}" aria-pressed="${!!counsel[it.id]}">${ic('counsel')}Needs counsel</button></div>
   </div>`;
}

/* ---------- band / header ---------- */
function fillPickers(){
  const m=M(),opts=m.order.map(id=>`<option value="${id}">${esc(m.docs[id].opt)}</option>`).join('');
  $('#pBase').innerHTML=opts;$('#pCmp').innerHTML=opts;
  $('#pBase').value=S.base;$('#pCmp').value=S.cmp;
  $('#pBase').setAttribute('aria-label',m.lBase);$('#pCmp').setAttribute('aria-label',m.lCmp);}
function renderBand(){
  $$('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  $('#pBase').title=doc(S.base).meta;$('#pCmp').title=doc(S.cmp).meta;
  $('#meta').innerHTML=`<span><b>Law firm</b> ${esc(FIRM)}</span><span><b>Fund</b> ${esc(FUND)}</span><span><b>Comparing</b> ${esc(doc(S.base).short)} with ${esc(doc(S.cmp).short)}${rev()?' (direction reversed)':''}</span><span><b>Result</b> from cache</span>`;
  renderStrip();}
function counselBadge(){const n=Object.keys(counsel).filter(k=>counsel[k]).length,c=$('#counselCount');c.hidden=!n;c.textContent=n;}
function render(o={}){
  renderBand();renderList();renderDiff();counselBadge();
  safeSet(store,JSON.stringify({view:S.view}));
  if(o.focus){const b=document.querySelector(`[data-sel="${o.focus}"]`);b&&b.focus({preventScroll:true});}
  if(o.focusSel){const e=$(o.focusSel);e&&e.focus();}
}
function toast(msg){$('#toastMsg').textContent=msg;$('#toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('on'),2600);}
function ensureSel(){const v=visible();if(!v.includes(byId(S.sel)))S.sel=v.length?v[0].id:S.sel;}
function select(id,focus){S.sel=id;render({focus:focus?id:null});$('#dp').scrollTop=0;}
function setMode(m){if(S.mode===m)return;S.mode=m;S.base=MODES[m].order[0];S.cmp=MODES[m].order[1];S.filter=null;S.sel=m==='version'?'C1':'S3';fillPickers();render();}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.other){toast(t.dataset.other+' is designed in a separate mockup.');return;}
  if(t.dataset.mode){setMode(t.dataset.mode);return;}
  if(t.dataset.sel){select(t.dataset.sel,true);return;}
  if(t.dataset.cell){S.filter=S.filter===t.dataset.cell?null:t.dataset.cell;ensureSel();render({focusSel:S.filter?`[data-cell="${S.filter}"]`:null});return;}
  if(t.id==='clearf'){S.filter=null;render();return;}
  if(t.id==='swapBtn'){const b=S.base;S.base=S.cmp;S.cmp=b;$('#pBase').value=S.base;$('#pCmp').value=S.cmp;ensureSel();render({focusSel:'#swapBtn'});return;}
  if(t.dataset.view){S.view=t.dataset.view;render({focusSel:`[data-view="${S.view}"]`});return;}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='review'){reviewed[id]=!reviewed[id];render({focusSel:`[data-act="review"]`});toast(reviewed[id]?'Marked as reviewed.':'Review mark removed.');}
  if(a==='counsel'){counsel[id]=!counsel[id];render({focusSel:`[data-act="counsel"]`});toast(counsel[id]?'Added to the counsel sheet draft.':'Removed from the counsel sheet draft.');}
});
document.addEventListener('change',e=>{
  if(e.target.id==='pBase'||e.target.id==='pCmp'){S.base=$('#pBase').value;S.cmp=$('#pCmp').value;ensureSel();render();}
});
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'&&S.filter){S.filter=null;render();return;}
  if(e.key==='j'||e.key==='k'){
    const ids=GROUPS[S.mode].flatMap(g=>visible().filter(i=>i.g===g.id)).map(i=>i.id);if(!ids.length)return;
    let i=ids.indexOf(S.sel);i=e.key==='j'?Math.min(ids.length-1,i+1):Math.max(0,i<0?0:i-1);
    select(ids[i],true);e.preventDefault();}
});

fillPickers();render();
})();
</script>
</body>
