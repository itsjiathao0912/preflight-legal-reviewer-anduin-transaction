<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub-doc QA · Findings v2 (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* Tokens: verbatim from design/mockups/app.html :root */
:root{
  --sbw:232px;
  --ground:#E9ECE9; --panel:#F4F6F3; --card:#FBFCFA; --paper:#FDFEFD;
  --ink:#15181B; --ink-2:#434A50; --ink-3:#5C646B;
  --accent:#1D5C57; --accent-tint:#D9E8E5; --step:#DDE2DD;
  --block-fg:#8A1C1C; --block-bg:#F7E2DF;
  --fix-fg:#734400;   --fix-bg:#F5E8C8;
  --note-fg:#38454F;  --note-bg:#DFE6EA;
  --ok-fg:#1B5632;    --ok-bg:#DAEEDF;
  --mark:#F3D676; --r:4px;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:8px;top:-48px;background:var(--ink);color:#fff;padding:8px 13px;border-radius:var(--r);z-index:120}
.skip:focus{top:40px}

/* mockup bar (not part of the product) */
.mbar{height:36px;background:var(--ink);color:#E9ECE9;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:13px}
.mbar b{font-weight:600}
.mbar .sp{flex:1}
.mbar .grp{display:inline-flex;align-items:center;gap:8px}
.mbar .sg{display:inline-flex;background:#2c3238;border-radius:var(--r);padding:2px}
.mbar .sg button{border:0;background:transparent;color:#C9CFCB;padding:2px 10px;border-radius:3px;font-size:13px}
.mbar .sg button[aria-pressed=true]{background:#E9ECE9;color:var(--ink)}
.mbar .rs{border:0;background:#2c3238;color:#E9ECE9;padding:3px 10px;border-radius:var(--r);font-size:13px}
.mbar :focus-visible{outline-color:#8FD0C6}

/* shell */
.app{height:calc(100dvh - 36px);display:grid;grid-template-columns:var(--sbw) minmax(0,1fr)}
@media (max-width:1199px){:root{--sbw:56px}}
aside.side{background:var(--ground);display:flex;flex-direction:column;gap:14px;padding:12px 8px;min-height:0;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font:500 20px/1 var(--serif);letter-spacing:-.01em;white-space:nowrap;padding-left:4px}
.brand svg{width:28px;height:28px;flex:none}
.docsw{width:100%;border:0;background:var(--panel);border-radius:var(--r);padding:8px 10px;display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;align-items:center;text-align:left}
.docsw:hover{background:var(--card)}
.docsw .dn{display:block;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docsw .df{display:block;font-size:13px;color:var(--ink-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.snav{display:grid;gap:16px;overflow:auto;min-height:0}
.gl{margin:0 0 4px;padding:0 10px;font:600 13px/1.4 var(--sans);color:var(--ink-3)}
nav.snav ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ni{position:relative;width:100%;border:0;background:transparent;height:36px;padding:0 8px;border-radius:var(--r);display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;color:var(--ink-2)}
.ni .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni:hover{background:var(--step);color:var(--ink)}
.ni[aria-current=page]{background:var(--card);color:var(--ink);font-weight:500}
.ni[aria-current=page]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--ink)}
.ni[aria-current=page]>.i{color:var(--ink)}
.nc{font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;min-width:20px;justify-content:center;border-radius:999px;padding:0 6px}
.nc:empty{display:none}
.nc.pulse,.gate.pulse{animation:pulse 1.1s var(--ease)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(29,92,87,.55)}100%{box-shadow:0 0 0 10px rgba(29,92,87,0)}}
.sbbot{margin-top:auto;display:grid;gap:10px}
.gate{width:100%;display:grid;grid-template-columns:18px minmax(0,1fr) 16px;gap:10px;align-items:center;border:0;border-radius:var(--r);padding:9px 10px;font-weight:600;font-size:14px;background:var(--block-bg);color:var(--block-fg);text-align:left;position:relative;transition:background .35s var(--ease),color .35s var(--ease)}
.gate.ready{background:var(--ok-bg);color:var(--ok-fg)}
.gate svg:first-child{width:18px;height:18px}
.gate .gn{display:none}
.seg{display:inline-flex;background:var(--step);border-radius:var(--r);padding:2px;width:max-content}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:3px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink)}
.allow{font-size:13px;color:var(--ink-3)}
.allow b{color:var(--ink);font-weight:500}
.me{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
.av{width:28px;height:28px;border-radius:999px;background:var(--step);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink-2);flex:none}
.me .nm{font-weight:500;white-space:nowrap}
@media (max-width:1199px){
  .brand span,.docsw .dtxt,.gl,.ni .lbl,.airow,.me .nm{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .docsw{grid-template-columns:1fr;justify-items:center;padding:8px 0}
  .ni{grid-template-columns:1fr;justify-items:center;padding:0}
  .gl{height:0;padding:0;margin:0;visibility:hidden}
  .nc{position:absolute;top:1px;right:3px;background:var(--ink);color:#fff;min-width:16px;height:16px;padding:0 4px;line-height:16px}
  .gate{grid-template-columns:1fr;justify-items:center;padding:9px 0}
  .gate .glab,.gate svg:last-child{display:none}
  .gate .gn{display:inline-grid;position:absolute;top:-3px;right:2px;background:var(--block-fg);color:#fff;border-radius:999px;min-width:16px;height:16px;place-items:center;font-size:13px;line-height:16px;padding:0 4px}
  .gate.ready .gn{display:none}
  .me{justify-content:center;padding:0}
  nav.snav{gap:10px}
}


/* main */
.stagearea{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.pagehead{display:flex;align-items:baseline;gap:16px;padding:16px 24px 8px;min-width:0}
.pagehead h1{margin:0;font:500 20px/1.2 var(--serif);letter-spacing:-.01em;outline:none}
.pagehead .meta{margin:0;color:var(--ink-3);font-size:14px;white-space:nowrap}
.strip{display:flex;gap:8px;align-items:center;padding:0 24px 8px;flex-wrap:wrap}
.sc{border:0;background:var(--card);border-radius:var(--r);padding:4px 8px;display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);white-space:nowrap}
.sc:hover,.sc[aria-expanded=true]{background:var(--step)}
.sc .i{width:16px;height:16px}
.sc.warn .i:first-child{color:var(--fix-fg)}
.sc.ok .i:first-child{color:var(--ink-2)}
.sc .ch{width:14px;height:14px;color:var(--ink-3)}
.sc b{font-weight:600;color:var(--ink)}

.work{flex:1 1 0;display:grid;grid-template-columns:minmax(0,1fr) 8px var(--fpw,600px);min-height:0}
.docpane{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.docbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 24px 8px;color:var(--ink-3);font-size:13px;white-space:nowrap}
.docbar span:first-child{overflow:hidden;text-overflow:ellipsis}
.scroll{overflow:auto;min-height:0}
.docscroll{padding:0 24px 80px}
.paper{background:var(--paper);max-width:700px;margin:0 auto;padding:48px 56px 64px;border-radius:var(--r);font:400 16px/1.72 var(--serif);color:#1b1e21}
.paper h1{font:500 28px/1.15 var(--serif);letter-spacing:-.02em;margin:0 0 4px}
.paper .sub{color:var(--ink-3);margin:0 0 32px;font-size:16px}
.paper h2{font:600 17px/1.3 var(--serif);margin:32px 0 8px;scroll-margin-top:24px}
.paper h3{font:600 15px/1.3 var(--serif);margin:16px 0 8px;color:var(--ink-2)}
.paper p{margin:0 0 12px;max-width:62ch}
.paper .fold{color:var(--ink-3);font-size:14px;font-family:var(--sans)}
mark.q{background:transparent;color:inherit;padding:0 1px;border-radius:2px;text-decoration-thickness:2px;text-underline-offset:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;cursor:pointer;transition:background .2s,opacity .3s}
mark.q.sev-block{text-decoration-line:underline;text-decoration-style:solid;text-decoration-color:var(--block-fg);background:rgba(138,28,28,.07)}
mark.q.sev-fix{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:#9A6200;background:rgba(154,98,0,.08)}
mark.q.sev-note{text-decoration-line:underline;text-decoration-style:dotted;text-decoration-color:var(--ink-3);background:rgba(56,69,79,.07)}
mark.q[data-g=counsel],mark.q[data-g=closed]{background:rgba(21,24,27,.06)}
mark.q[data-g=dismissed]{opacity:.5;text-decoration-line:none;background:transparent}
mark.q.on{background:var(--mark);outline:3px solid var(--mark);opacity:1}
mark.q.flash{animation:flash 1.1s var(--ease)}
@keyframes flash{0%{outline-width:10px;outline-color:rgba(243,214,118,.55)}100%{outline-width:3px;outline-color:var(--mark)}}
.mask{font-family:var(--sans);font-size:14px;background:var(--step);padding:1px 6px;border-radius:3px;letter-spacing:.04em}

/* splitters */
.grip{cursor:col-resize;position:relative;touch-action:none}
.grip::after{content:"";position:absolute;left:3px;top:35%;bottom:35%;width:2px;border-radius:2px;background:var(--step);transition:background .2s}
.hsplit{cursor:row-resize;position:relative;touch-action:none;background:var(--panel)}
.hsplit::after{content:"";position:absolute;top:3px;left:40%;right:40%;height:2px;border-radius:2px;background:var(--step);transition:background .2s}
.grip:hover::after,.grip:focus-visible::after,.grip.drag::after,.hsplit:hover::after,.hsplit:focus-visible::after,.hsplit.drag::after{background:var(--ink-3)}
.grip:focus-visible,.hsplit:focus-visible{outline-offset:-2px}

/* buttons */
.btn{border:0;border-radius:var(--r);padding:8px 16px;font-size:14px;font-weight:500;display:inline-flex;gap:8px;align-items:center;justify-content:center;background:var(--step);color:var(--ink);min-height:36px}
.btn:hover{background:#D1D8D2}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:#2c3238}
.btn.sm{padding:4px 8px;min-height:32px;font-size:13px}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--step)}
.btn svg{width:16px;height:16px}

/* findings panel: header, list, splitter, detail */
aside.fp{background:var(--card);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.ph{padding:16px 16px 8px;display:flex;align-items:center;gap:16px;min-width:0}
.ph b{font-weight:600;font-size:15px;white-space:nowrap}
.bar{flex:1 1 80px;height:4px;border-radius:2px;background:var(--step);overflow:hidden;min-width:48px}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:2px;transition:width .4s var(--ease)}
.cnts{display:flex;gap:8px;font-size:13px;color:var(--ink-3);white-space:nowrap}
.cnts button{border:0;background:transparent;color:var(--ink-3);padding:2px 4px;border-radius:3px;font-size:13px}
.cnts button:hover{background:var(--panel);color:var(--ink)}
.cnts .n{font-weight:600;color:var(--ink)}
.cnts .bump{animation:bump .9s var(--ease)}
@keyframes bump{0%{background:var(--ink);color:#fff}100%{background:transparent}}
.flist{padding:0 8px 16px}
.gh{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:0 8px;font-size:13px;font-weight:600;color:var(--ink-2)}
button.gh{border:0;background:transparent;text-align:left;border-radius:var(--r)}
button.gh:hover{background:var(--panel)}
.gh .chv{width:14px;height:14px;transition:transform .2s var(--ease)}
.gh[aria-expanded=true] .chv{transform:rotate(90deg)}
.gh .ct{font-weight:600;color:var(--ink)}
.gh .chips{margin-left:auto;display:flex;gap:4px;font-weight:400}
.chip{border:0;background:var(--panel);border-radius:var(--r);padding:2px 8px;display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip svg{width:14px;height:14px}
.chip .n{font-weight:600}
.sv-block{color:var(--block-fg)}.sv-fix{color:#8A5A00}.sv-note{color:var(--note-fg)}
.chip[aria-pressed=true] .sv-block,.chip[aria-pressed=true] .sv-fix,.chip[aria-pressed=true] .sv-note{color:#fff}
ul.rows{list-style:none;margin:0;padding:0}
.li{overflow:hidden;transition:max-height .24s var(--ease),opacity .2s}
.li.leaving{opacity:0;max-height:0!important}
.li.landed .lr{animation:land .9s var(--ease)}
@keyframes land{0%{background:var(--step)}100%{background:transparent}}
.lr{width:100%;height:36px;border:0;background:transparent;border-radius:var(--r);display:grid;grid-template-columns:16px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:0 8px 0 12px;text-align:left;position:relative}
.lr:hover{background:var(--panel)}
.lr[aria-current=true]{background:transparent;height:auto;min-height:36px;padding-top:8px;padding-bottom:8px;align-items:start}
.lr[aria-current=true] .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lr[aria-current=true] .si{padding-top:2px}
.li.open{background:var(--paper);border:1px solid var(--step);border-radius:var(--r);box-shadow:0 1px 2px rgba(21,24,27,.04),0 4px 12px rgba(21,24,27,.04);margin:8px 0}
.abar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px;background:var(--card);border-top:1px solid rgba(21,24,27,.08)}
.abar .btn{width:100%}
.abar .btn[disabled]{opacity:.45;cursor:default}
.abar .btn[disabled]:hover{background:inherit}
.abar .btn.pri[disabled]:hover{background:var(--ink)}
.abar .one{grid-column:1 / -1}
.rx{padding:8px 16px 16px 36px;display:grid;gap:16px;animation:in .25s var(--ease)}
.rx .kick{margin:0}
.rxact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rxact .btn{width:100%}
.rxact .st{grid-column:1 / -1;display:flex;gap:16px;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.rxact .st b{color:var(--ink);font-weight:600}
.btn.out{background:transparent;box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.btn.out:hover{background:var(--step)}
.lr:focus-visible{outline-offset:-2px}
.lr .si{display:inline-flex}
.lr .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr[aria-current=true] .t{font-weight:600}
.lr .rf{font-size:13px;color:var(--ink-3);white-space:nowrap}
.lr .ex{display:inline-flex;gap:4px;align-items:center}
.tag{font-size:13px;font-weight:500;padding:0 8px;border-radius:3px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap;line-height:20px}
.tag svg{width:12px;height:12px}
.t-ai{background:#E6E3F0;color:#3D3566}
.t-st{background:var(--step);color:var(--ink-2)}
.t-anno{background:transparent;color:var(--ink-2);outline:1px dashed var(--ink-3);outline-offset:-1px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);display:inline-block;opacity:.6}
.empty{padding:16px 8px;color:var(--ink-3);font-size:14px}

/* detail */
.dwrap{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;background:var(--paper)}
.dwrap>.none{grid-row:1 / -1}
.dhead{padding:16px 24px 8px;display:grid;gap:8px}
.dscroll{padding:16px 24px;display:grid;gap:16px;align-content:start;overflow:auto;min-height:0}
.tabs{display:flex;gap:8px;padding:0 24px;background:var(--paper)}
.tab{border:0;background:transparent;padding:8px;min-height:36px;font-size:14px;font-weight:500;color:var(--ink-3);border-radius:var(--r) var(--r) 0 0;position:relative;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab[aria-selected=true]{color:var(--ink);font-weight:600}
.tab[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--accent)}
.tab:focus-visible{outline-offset:-2px}
details.more{background:transparent;border-top:1px solid var(--step);padding:8px 0 0}
details.more summary{padding:0}
.dd{padding:8px 0 8px 22px!important}
details.more summary:focus-visible{outline-offset:2px}
.tab .bd{width:8px;height:8px;border-radius:50%;background:var(--fix-fg)}
.tabs{box-shadow:inset 0 -1px 0 var(--step)}
.kick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.kick .sv{display:inline-flex;gap:4px;align-items:center;font-weight:600}
.dt{margin:0;font:500 18px/1.35 var(--serif);letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lab{font-size:13px;font-weight:600;color:var(--ink-3);margin:0 0 4px}
.dp{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2)}
blockquote.ev{margin:0;font:400 16px/1.6 var(--serif);background:transparent;padding:0 0 0 16px;border-left:2px solid var(--step)}
blockquote.ev .hit{background:rgba(243,214,118,.55);border-radius:2px;padding:0 1px}
.pfix{background:transparent;border-left:2px solid var(--step);padding:0 0 0 16px;font-size:14px;color:var(--ink-2)}
.pfix b{font-weight:600;color:var(--ink)}
.revealbtn{border:0;background:var(--step);border-radius:3px;padding:0 8px;font-size:13px;display:inline-flex;gap:4px;align-items:center;margin-left:8px;vertical-align:1px;font-family:var(--sans)}
.revealbtn svg{width:14px;height:14px}
details.more summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);border-radius:var(--r);min-height:32px;font-weight:500}
details.more summary::-webkit-details-marker{display:none}
details.more summary .chv{width:14px;height:14px;transition:transform .2s var(--ease);color:var(--ink-3)}
details.more[open] summary .chv{transform:rotate(90deg)}
details.more summary .hint{color:var(--ink-3);font-weight:400;font-size:13px}
.dd{display:grid;gap:8px;padding:8px 0 0 22px;font-size:14px;color:var(--ink-2)}
.dd dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.dd dt{color:var(--ink-3)}.dd dd{margin:0}
.dd p{margin:0}
.dd .qt{font:400 15px/1.55 var(--serif);color:var(--ink)}
.dact{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 24px;background:var(--paper);box-shadow:0 -8px 16px -16px rgba(21,24,27,.4)}
.dact .btn{width:100%}
.dact .st{grid-column:1 / -1;display:flex;gap:16px;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.dact .st b{color:var(--ink);font-weight:600}
.done{margin:8px 24px;background:var(--ok-bg);color:var(--ok-fg);border-radius:var(--r);padding:16px;display:grid;gap:8px;animation:in .4s var(--ease)}
.done.wait{background:var(--fix-bg);color:#3F2A00}
.done h2{margin:0;font:500 18px/1.3 var(--serif);display:flex;gap:8px;align-items:center}
.done p{margin:0;font-size:14px}
.done .acts{display:flex;gap:8px;flex-wrap:wrap}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
