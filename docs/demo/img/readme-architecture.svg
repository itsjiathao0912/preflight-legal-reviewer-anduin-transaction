<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
  <title id="t">Architecture of the subscription document QA tool</title>
  <desc id="d">The browser runs the UI and the engine. A thin Cloudflare Worker proxies AI and OCR to OpenRouter free models and serves the firm memory API backed by D1. Documents are never stored on the server.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1f2328}
    .h{font-size:18px;font-weight:700}.s{font-size:14px}.m{font-size:13px;fill:#57606a}.w{font-size:14px;font-weight:600}
    .box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}
    .step{fill:#fff;stroke:#0f766e;stroke-width:1.5}
    .ai{fill:#f1eefb;stroke:#3D3566;stroke-width:1.5}
    .ln{stroke:#57606a;stroke-width:1.8;fill:none}
  </style>
  <rect width="1280" height="560" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <rect x="30" y="30" width="520" height="440" rx="12" class="box"/>
  <text x="52" y="62" class="h">Browser (the analyst's machine)</text>
  <text x="52" y="84" class="m">React UI + engine in a Web Worker. Documents stay here.</text>
  <rect x="52" y="104" width="476" height="52" rx="8" class="step"/><text x="68" y="126" class="w">1. Parse</text><text x="68" y="145" class="s">HTML, text PDF, DOCX, scanned pages</text>
  <rect x="52" y="168" width="476" height="52" rx="8" class="step"/><text x="68" y="190" class="w">2. Structure and logic graph</text><text x="68" y="209" class="s">sections, references, conditionals, defined terms</text>
  <rect x="52" y="232" width="476" height="52" rx="8" class="step"/><text x="68" y="254" class="w">3. 13 deterministic detectors</text><text x="68" y="273" class="s">findings with quoted evidence and location</text>
  <rect x="52" y="296" width="476" height="52" rx="8" class="step"/><text x="68" y="318" class="w">4. Triage, gate, counsel sheet (DOCX)</text><text x="68" y="337" class="s">Ask counsel / Close issue; Blocked until answered</text>
  <rect x="52" y="364" width="476" height="84" rx="8" fill="#fff" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="68" y="388" class="w">IndexedDB, kept 24 h</text><text x="68" y="408" class="s">documents, packages, triage state</text><text x="68" y="428" class="m">Findings render first; memory and AI load after.</text>

  <rect x="660" y="30" width="330" height="440" rx="12" class="box"/>
  <text x="682" y="62" class="h">Cloudflare Worker</text>
  <text x="682" y="84" class="m">Thin proxy. Never parses documents.</text>
  <rect x="682" y="104" width="286" height="84" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="698" y="128" class="w">/api/ai and /api/ocr</text><text x="698" y="148" class="s">Turnstile, quotas, spend cap,</text><text x="698" y="168" class="s">content-hash cache, circuit breaker</text>
  <rect x="682" y="204" width="286" height="64" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="698" y="228" class="w">/api/memory, /api/session</text><text x="698" y="248" class="s">firm memory, decisions, answers</text>
  <rect x="682" y="284" width="286" height="64" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text x="698" y="308" class="w">Static assets</text><text x="698" y="328" class="s">the web app and bundled samples</text>
  <text x="682" y="380" class="m">Masks sensitive spans before any</text><text x="682" y="398" class="m">text leaves for a model.</text>

  <rect x="1090" y="60" width="160" height="110" rx="12" class="ai"/>
  <text x="1170" y="96" class="h" text-anchor="middle" style="fill:#3D3566">OpenRouter</text>
  <text x="1170" y="120" class="s" text-anchor="middle">free models only</text><text x="1170" y="140" class="s" text-anchor="middle">AI judgment, OCR</text>
  <rect x="1090" y="290" width="160" height="110" rx="12" class="box"/>
  <text x="1170" y="326" class="h" text-anchor="middle">D1</text>
  <text x="1170" y="350" class="s" text-anchor="middle">firm memory</text><text x="1170" y="370" class="s" text-anchor="middle">masked snippets</text><text x="1170" y="390" class="s" text-anchor="middle">and hashes only</text>

  <path d="M550 150 H660" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="605" y="140" class="m" text-anchor="middle">clause</text><text x="605" y="170" class="m" text-anchor="middle">snippets</text>
  <path d="M550 236 H660" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M990 236 H1040 V345 H1090" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M990 150 H1040 V115 H1090" class="ln" marker-end="url(#a)"/>

  <rect x="30" y="490" width="1220" height="48" rx="10" fill="#e6f4f1" stroke="#0f766e"/>
  <text x="640" y="520" class="w" text-anchor="middle" style="fill:#0b4f47">Full documents are never stored on the server. Parsing and the checks run in the browser; AI is optional and never gates.</text>
</svg>
